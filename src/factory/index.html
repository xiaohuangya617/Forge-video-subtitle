<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self'; script-src 'self'; connect-src 'none'">
<title>智能字幕工厂</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand"><img class="logo" src="assets/smart-subtitle-factory-icon.png" alt=""><div><h1>智能字幕工厂</h1></div></div><div class="head-right"><label class="header-check"><input id="trayOnClose" type="checkbox">关闭后缩小至托盘</label><span class="pill">4.1.9</span></div></header>
<nav role="tablist"><button id="tabGenerate" role="tab" aria-selected="true" class="tab active">① 字幕生成</button><button id="tabEdit" role="tab" aria-selected="false" class="tab">② 校对验证 <small>可选</small></button><div class="settings-actions" id="settingsActions"><span id="settingsStatus">设置载入中</span><button id="saveSettings" disabled>保存设置</button><button id="exportSettings" disabled title="导出 JSON，不包含 API Key">导出设置</button><button id="importSettings" disabled>导入设置</button></div></nav>
<main id="generate" role="tabpanel"><div class="workspace">
<section class="card queue" id="taskZone"><div class="section-head queue-head"><div class="queue-heading"><h2>视频任务 <span id="count" class="count">0</span></h2></div><div class="queue-actions"><button id="add">导入视频</button><button id="addFolder">导入文件夹</button><button id="viewLog" class="outline-button">任务日志</button></div></div><div class="list-title"><span>按列表顺序执行</span><span>排序 / 移除</span></div><div id="tasks" class="task-list"></div><div class="queue-foot"><span id="queueSummary">等待添加视频</span><button id="clear">清空</button></div></section>
<div class="settings">
<section class="card recognition-card"><div class="section-head"><h2>识别设置</h2><button id="recognitionToggle" class="outline-button toggle-button active" type="button" aria-pressed="true">启用识别</button><div class="mode-switch" role="group" aria-label="识别方式"><button id="recognitionModeLocal" type="button">本机模型</button><button id="recognitionModeCloud" type="button">云端接口</button></div></div><input id="recognitionEnabled" type="checkbox" hidden checked><input id="recognitionMode" type="hidden" value="local"><div id="recognitionLocal"><div class="grid recognition-local-primary"><label>本机模型<input value="Whisper Small（内置模型，结束释放）" readonly></label><label>本机处理模式<select id="cpuMode"><option value="performance">高性能</option><option value="balanced">均衡 CPU</option></select><small>均衡模式会降低 CPU 占用，但预计耗时增加</small></label></div></div><div id="recognitionCloud" hidden><div class="grid recognition-cloud-primary"><label>API Key<input id="recognitionKey" type="password" placeholder="阿里云 DashScope API Key" autocomplete="off"></label><label>模型名称<input id="recognitionModel" value="qwen-audio-3.0-asr-flash-filetrans"></label></div><div class="grid recognition-cloud-parameters"><label>Base URL<input id="recognitionBaseurl" value="https://dashscope.aliyuncs.com/api/v1"></label><label>请求超时（秒）<input id="recognitionTimeout" type="number" value="120" min="1" max="3600" step="1"></label><label>自动重试次数<input id="recognitionRetries" type="number" value="2" min="0" max="10" step="1"></label></div><label>识别提示词<textarea id="recognitionPrompt">日本語の映画・ドラマの自然な会話。日常会話、人物の名前、呼びかけ、短い返事。</textarea></div></section>
<section class="card translate"><div class="section-head"><h2>翻译设置</h2><button id="translationToggle" class="outline-button toggle-button" type="button" aria-pressed="true">启用翻译</button><button id="clearCache" class="outline-button" type="button">清除翻译缓存</button><span class="cache-hint">缓存用于断点续传，成功后自动清理</span><div class="mode-switch" role="group" aria-label="翻译方式"><button id="modeLocal" type="button">本机模型</button><button id="modeCloud" type="button">云端接口</button></div><input type="checkbox" id="translationEnabled" hidden checked></div><input id="translationMode" type="hidden" value="local"><input id="localBaseurl" type="hidden" value="http://127.0.0.1:8092/v1"><div id="translationLocal"><label>本机模型<input id="translationLocalModel" value="Hy-MT2（内置模型，结束释放）" readonly></label></div><div id="translationCloud" hidden><div class="grid translation-cloud-primary"><label id="keyField">API Key<input id="key" type="password" placeholder="DeepSeek API Key" autocomplete="off"></label><label>模型名称<input id="model" value="deepseek-flash"></label></div><div class="grid translation-cloud-parameters"><label>Base URL<input id="baseurl" value="https://api.deepseek.com"></label><label>目标语言<select id="language"><option>中文</option><option>英语</option><option>日语</option></select></label><label>请求超时（秒）<input id="timeout" type="number" value="120" min="1" max="3600" step="0.001"></label><label>max_tokens<input id="tokens" type="number" value="8192" min="1000"></label><label title="首次失败后额外重试的次数；0 表示不重试，最多 10 次">自动重试次数<input id="retries" type="number" value="2" min="0" max="10" step="1"></label></div><label>翻译提示词<textarea id="prompt">请将字幕翻译为自然流畅的中文，保留人物语气和称呼，不遗漏、不合并字幕条目。</textarea></div></section>
</div></div><section class="bottom card"><div class="path-row"><label for="genDir">生成输出</label><input id="genDir" placeholder="默认源视频目录，也可选择统一输出目录" readonly><button id="pickGen">选择文件夹</button><button id="openGen" class="text-button">打开</button></div><div class="execution"><div class="progress-area"><div class="progress-label"><span id="status">就绪 · 完成后可直接测试字幕</span><b id="percent">0%</b></div><progress id="progress" max="100" value="0"></progress></div><button id="cancel" disabled>取消</button><button id="start" class="primary">▶ 开始执行</button><button id="forceStart" class="force-button">强制执行</button></div></section></main>
<main id="edit" role="tabpanel" hidden><section class="card editor-card"><div class="section-head editor-title"><h2>原文 / 译文对照</h2><span id="flagCount" class="warning-count">按需加载字幕</span><div class="row"><select id="editTask" aria-label="选择生成任务"><option value="">选择已生成任务</option></select><button id="loadTask">加载</button><button id="importPair">导入原声 + 译文</button></div></div><div class="editor-tools"><input id="find" placeholder="查找译文" aria-label="查找译文"><input id="replace" placeholder="替换为" aria-label="替换为"><button id="findNext">查找下一个</button><button id="replaceOne">替换当前</button><button id="replaceAll">全部替换</button></div><div class="rules"><label class="inline"><input type="checkbox" id="flagJa" checked>日文残留</label><label class="inline"><input type="checkbox" id="flagEn" checked>英文残留</label><span>指定词</span><input id="rules" placeholder="多个词以逗号分隔" value=""><button id="repeatFlag" class="outline-button" type="button" aria-pressed="false">重复标红</button><button id="onlyFlag" class="outline-button" type="button" aria-pressed="false">只看标红</button></div><div class="editor-heading"><span>序号 / 时间轴</span><span>原文 · 只读</span><span>译文 · 可编辑</span></div><div id="cues" class="cue-list"><div class="empty"><b>需要精细校对时，再加载字幕</b><p>选择已生成任务，或导入已有原声与译文 SRT。</p><small>批量生成的字幕可直接使用，无需经过此页签。</small></div></div></section><section class="bottom card"><div class="path-row"><label for="editDir">成品输出</label><input id="editDir" placeholder="独立于生成目录，请选择成品位置" readonly><button id="pickEdit">选择文件夹</button><button id="openEdit" class="text-button">打开</button></div><div class="execution"><div class="validation" id="validation">导出时检查结构、时间轴和空译文；标红项作为质量提醒。</div><button id="export" class="primary">验证并导出 SRT</button></div></section></main>
<dialog id="estimateDialog"><form method="dialog"><h2>执行前预估</h2><div class="estimate-grid"><span>任务数量</span><b id="estimateTasks">-</b><span>执行模式</span><b id="estimateMode">-</b><span>预计耗时</span><b id="estimateTime">-</b><span>预计空间</span><b id="estimateSpace">-</b><span>当前可用</span><b id="estimateAvailable">-</b></div><p id="estimateNote">预计值会受电脑性能、音频内容、网络和重试影响。</p><p id="estimateError" class="estimate-error" hidden></p><div class="dialog-actions"><button value="cancel">取消</button><button id="estimateConfirm" value="default" class="primary">确定执行</button></div></form></dialog><div id="toast" role="status" hidden></div><script src="units.js"></script><script src="app.js"></script></body></html>
